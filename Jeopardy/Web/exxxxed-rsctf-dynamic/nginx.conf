server {
    listen 8080;
    absolute_redirect off;
    root /var/www/html;
    index index.html;

    location /report/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
